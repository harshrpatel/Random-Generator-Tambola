        <script type="text/javascript">
          // Utility: small numeric animation reused from nostalgia page
          (function($){
            $.fn.extend({
              numAnim: function(options) {
                if (!this.length) return false;
                this.defaults = { endAt: 2560, numClass: 'autogen-num', duration: 1, interval: 60 };
                var settings = $.extend({}, this.defaults, options);
                var $num = $('<span/>', { 'class': settings.numClass });
                return this.each(function() {
                  var $this = $(this);
                  var frag = document.createDocumentFragment(), numLen = settings.endAt.toString().length;
                  for (x = 0; x < numLen; x++) { var rand_num = Math.floor(Math.random() * 10); frag.appendChild($num.clone().text(rand_num)[0]); }
                  $this.empty().append(frag);
                  var get_next_num = function(num){ ++num; if(num>9) return 0; return num; };
                  $this.find('.' + settings.numClass).each(function(){
                    var $num = $(this), num = parseInt($num.text());
                    var interval = setInterval(function(){ num = get_next_num(num); $num.text(num); }, settings.interval);
                    setTimeout(function(){ clearInterval(interval); }, settings.duration * 300 - settings.interval);
                  });
                  setTimeout(function(){ $this.text(settings.endAt.toString()); $("#mirageElement").css("display","none"); $('#numCounter').css("display",""); }, settings.duration * 300);
                });
              }
            });
          })(jQuery);

          // Hardcoded categories and items from musical-housie.csv
          var categories = {
            "Romantic Classics": [
              "Pehla Nasha","Tujhe Dekha To","Suraj Hua Maddham","Janam Janam","Raabta",
              "Tum Mile","Raataan Lambiyan","Hawayein","Agar Tum Saath Ho","Main Agar Kahoon",
              "Do Dil Mil Rahe Hain","Tum Hi Ho","Tera Hone Laga Hoon","Tere Mast Mast Do Nain","O Re Piya"
            ],
            "90s Songs": [
              "Chaiyya Chaiyya","Ole Ole","Tan Tana Tan","Dil To Pagal Hai","O O Jaane Jaana",
              "Ek Ladki Ko Dekha","Tu Cheez Badi Hai Mast Mast","Tip Tip Barsa Pani","Raja Ko Rani Se Pyar Ho Gaya","Mera Dil Bhi Kitna Pagal Hai",
              "Saat Samundar Paar","Humma Humma","Ae Kash Ke Hum","Ghar Se Nikalte Hi","Pehla Pehla Pyar Hai"
            ],
            "Iconic Singers (80s–2000s)": [
              "Kishore Kumar","Lata Mangeshkar","Asha Bhosle","Mohammed Rafi","Kumar Sanu",
              "Udit Narayan","Alka Yagnik","Sonu Nigam","Shreya Ghoshal","Sunidhi Chauhan",
              "KK","Shaan","A.R. Rahman","Himesh Reshammiya","Vishal Dadlani"
            ],
            "2000s Songs (2000–2012)": [
              "Kal Ho Na Ho","Tum Se Hi","Khuda Jaane","Pee Loon","Ajab Si",
              "Zara Zara","Mitwa","Tu Jaane Na","Mast Magan","Tujh Mein Rab Dikhta Hai",
              "Sajda","Tere Naina","Be Intehaan","Desi Girl","Kajra Re"
            ],
            "Evergreen Legends": [
              "Lag Ja Gale","Ajeeb Dastan Hai Yeh","Tere Bina Zindagi Se","Piya Tu Ab To Aaja","Dum Maro Dum",
              "Chura Liya Hai Tumne","Pal Pal Dil Ke Paas","Mere Sapno Ki Rani","Roop Tera Mastana","Zindagi Ek Safar",
              "Likhe Jo Khat Tujhe","Chaudhvin Ka Chand","Baharon Phool Barsao","Yeh Mera Dil","Pyar Kiya To Darna Kya"
            ],
            "Party Anthems": [
              "Badtameez Dil","Zingaat","Cutiepie","Gallan Kardi","Aaj Ki Party",
              "Dil Chori","Nashe Si Chadh Gayi","Ghagra","Jai Ho","Senorita",
              "Sheila Ki Jawani","Abhi Toh Party Shuru Hui Hai","Kar Gayi Chull","Bom Diggy","London Thumakda"
            ]
          };

          // Build flat items with category metadata
          var allItems = [];
          (function buildAll(){
            var idx = 0; var names = Object.keys(categories);
            names.forEach(function(cat){
              categories[cat].forEach(function(name){
                allItems.push({ id: idx++, name: name, category: cat, categoryIndex: names.indexOf(cat) });
              });
            });
          })();

          // Populate table headers and cells
          function populateTable(){
            var names = Object.keys(categories);
            var $hr = $('#headerRow');
            names.forEach(function(cat){ $hr.append('<td class="category-header">' + cat + '</td>'); });
            for (var row = 0; row < 15; row++){
              for (var col = 0; col < names.length; col++){
                var cat = names[col];
                var items = categories[cat];
                if (row < items.length){
                  var itemName = items[row];
                  var itemId = allItems.findIndex(function(it){ return it.name === itemName && it.category === cat; });
                  var cell = $('#mainTable tr').eq(row + 1).find('td').eq(col);
                  cell.addClass('cell' + itemId).text(itemName);
                }
              }
            }
          }

          $(function(){
            var last5call = [];
            var animDuration = 1;

            // Initial population
            populateTable();
            // Restore selected from storage
            if (window.localStorage.getItem('selected_musical_items')){
              var selectedArray = window.localStorage.getItem('selected_musical_items').split(',');
              for (var i = 0; i < selectedArray.length; i++){
                $('td.cell' + selectedArray[i]).addClass('selected');
              }
            }

            $("#mirageElement").css("display","none");
            var engine = {
              selectedItems: [],
              nextIndex: function(){
                if (window.localStorage.getItem('selected_musical_items')){
                  var getStorage = window.localStorage.getItem('selected_musical_items').split(',');
                  engine.selectedItems = getStorage.map(Number);
                }
                if (engine.selectedItems.length >= allItems.length){
                  alert('All items Exhausted!');
                  return -1;
                }
                var r = Math.floor(Math.random() * allItems.length);
                while ($.inArray(r, engine.selectedItems) > -1){ r = Math.floor(Math.random() * allItems.length); }
                engine.selectedItems.push(r);
                window.localStorage.setItem('selected_musical_items', engine.selectedItems);
                return r;
              }
            };

            $('#btnReset').click(function(){
              var r = confirm('Are you sure you want to reload the board?');
              if (r === true){
                if (window.localStorage.getItem('selected_musical_items')){
                  window.localStorage.removeItem('selected_musical_items');
                  location.reload();
                }
              }
            });

            $('#btnGenerate').click(function(){
              $("#bingoWords").text("");
              document.querySelectorAll('.highlight').forEach(function(el){ el.classList.remove('highlight'); });

              var random = engine.nextIndex();
              if (random === -1) return;
              var selectedItem = allItems[random];

              if (last5call.length == 5){ last5call.pop(); last5call.unshift(selectedItem.category + ': ' + selectedItem.name); }
              else { last5call.unshift(selectedItem.category + ': ' + selectedItem.name); }
              for (var i = 0; i <= last5call.length; i++){
                if (last5call[i]){ document.getElementById('lastCall' + i).innerHTML = (i+1) + ') ' + last5call[i]; }
              }

              $("#numCounter").css("display","none");
              $("#mirageElement").css("display","");
              $("#heading").text("✨ Now Playing ✨");
              $("#mirageElement").numAnim({ endAt: allItems.length, duration: animDuration });
              setTimeout(function(){
                $('td.cell' + random).addClass('selected highlight');
                $("#heading").text("");
                $("#bingoWords").text(selectedItem.category + ': ' + selectedItem.name);
              }, animDuration * 300);
            });

            window.onbeforeunload = function(e){ e = e || window.event; var returnString = 'Are you sure?'; if (e) { e.returnValue = returnString; } return returnString; };
          });
